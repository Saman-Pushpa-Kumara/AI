<script>
    // 1. Generate Manifest Dynamically
    const manifest = {
        "name": "CYBER-CORE",
        "short_name": "CYBER-CORE",
        "start_url": window.location.href,
        "display": "standalone",
        "background_color": "#04070d",
        "theme_color": "#060913",
        "icons": [{
            "src": "https://cdn-icons-png.flaticon.com/512/3256/3256783.png",
            "sizes": "512x512",
            "type": "image/png",
            "purpose": "any maskable"
        }]
    };
    
    // Inject Manifest into Head
    const manifestString = encodeURIComponent(JSON.stringify(manifest));
    document.getElementById('manifest-link').setAttribute('href', 'data:application/json;charset=utf-8,' + manifestString);

    // 2. Generate and Register Service Worker Dynamically
    const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => new Response("CYBER-CORE: Network Required.")));
        });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(swUrl).then(() => {
            console.log("PWA Service Worker Registered!");
        }).catch(err => console.log("PWA SW Error:", err));
    }

    // 3. PWA Install Logic
    let deferredPrompt;
    const installBtn = document.getElementById('menu-install');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'flex'; // Show Install Button in Menu
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });

    window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        console.log('PWA successfully installed.');
    });
</script>

    // UI Elements
    const securityScreen = document.getElementById('security-screen');

    // --- Audio System ---
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type, duration) {
        if (!isSoundEnabled) return;
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    const soundEffects = {
        send: () => { playTone(600, 'sine', 0.1); setTimeout(() => playTone(880, 'sine', 0.15), 60); },
        receive: () => { playTone(450, 'triangle', 0.12); setTimeout(() => playTone(650, 'sine', 0.18), 80); },
        decrypt: () => { playTone(1200, 'sine', 0.05); setTimeout(() => playTone(1800, 'sine', 0.1), 50); }
    };

    // --- Auth Check ---
    function checkDeviceAuth() {
        const storedPass = localStorage.getItem("cyber_pass");
        if (!storedPass) {
            secUsername.style.display = "block"; 
            secBtn.innerText = "GENERATE KEYS & ENTER";
        } else {
            secUsername.style.display = "none"; 
            secBtn.innerText = "DECRYPT CHANNEL";
        }
    }

    secBtn.addEventListener('click', () => {
        initAudio();
        const storedPass = localStorage.getItem("cyber_pass");
        const pass = secPassword.value.trim();

        if (!storedPass) {
            const user = secUsername.value.trim();
            if (!user || !pass) return alert("කරුණාකර නම සහ Password එක ඇතුලත් කරන්න!");
            localStorage.setItem("cyber_user", user); 
            localStorage.setItem("cyber_pass", pass);
            currentUser = user; unlockUI();
        } else {
            if (pass === storedPass) { 
                currentUser = localStorage.getItem("cyber_user"); unlockUI(); 
            } else { 
                alert("Security Key වැරදියි! Access Denied."); 
                secPassword.value = ""; 
            }
        }
    });

    function unlockUI() {
        securityScreen.style.display = "none";
        document.getElementById('active-user-tag').innerText = `AGENT: ${currentUser.toUpperCase()}`;
        secPassword.value = ""; 
        messageInput.focus();
    }

    document.getElementById('menu-toggle-btn').addEventListener('click', (e) => { 
        e.stopPropagation(); document.getElementById('tech-menu').classList.toggle('show'); 
    });
    document.addEventListener('click', () => document.getElementById('tech-menu').classList.remove('show'));

    });

    // Toggle Send Encryption State
    document.getElementById('menu-enc-toggle').addEventListener('click', () => {
        isEncryptionEnabled = !isEncryptionEnabled;
        const txt = document.getElementById('enc-state-txt');
        txt.innerText = isEncryptionEnabled ? "ON" : "OFF";
        txt.style.color = isEncryptionEnabled ? "var(--neon-green)" : "var(--neon-yellow)";
        messageInput.placeholder = isEncryptionEnabled ? "Type secure message..." : "Type unencrypted message...";
        document.getElementById('active-user-tag').innerText = isEncryptionEnabled ? "AES-256 SECURED" : "CONNECTION UNSECURED";
        document.getElementById('active-user-tag').style.color = isEncryptionEnabled ? "var(--neon-green)" : "var(--neon-yellow)";
    });

    // Clear Local Screen
    document.getElementById('menu-clear-screen').addEventListener('click', () => {
        localMessages = []; 
        renderAllMessages(); 
    });

    // --- Global Decrypt Toggle ---
    globalDecryptBtn.addEventListener('click', () => {
        isGlobalDecrypted = !isGlobalDecrypted;
        
        if(isGlobalDecrypted) {
            globalDecryptBtn.classList.add('unlocked');
            document.getElementById('icon-locked').style.display = 'none';
            document.getElementById('icon-unlocked').style.display = 'block';

            document.getElementById('icon-locked').style.display = 'block';
            document.getElementById('icon-unlocked').style.display = 'none';
        }
        
        renderAllMessages();

    // --- Sending Messages ---
    function sendMessage() {
        const rawText = messageInput.value.trim();
        if (!rawText || !currentUser) return;
        
        let finalText = rawText;
        let isEnc = false;

        if (isEncryptionEnabled) {
            const secretKey = localStorage.getItem("cyber_pass");
            finalText = CryptoJS.AES.encrypt(rawText, secretKey).toString();
            isEnc = true;
        }
        
        push(messagesRef, { 
            sender: currentUser, 
            text: finalText, 
            isEncrypted: isEnc, 
            timestamp: Date.now() 
        }).then(() => {
            soundEffects.send();
            set(ref(db, 'typing/' + currentUser), false); 
        });
        
        messageInput.value = "";
    }

    document.getElementById('send-btn').addEventListener('click', () => sendMessage());
    
    // --- Typing Indicator Logic ---
    let typingTimeout;
    messageInput.addEventListener('input', () => {
        set(ref(db, 'typing/' + currentUser), true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { set(ref(db, 'typing/' + currentUser), false); }, 1500);
    });
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    onValue(typingRef, (snapshot) => {
        const typingData = snapshot.val();
        let isSomeoneTyping = false;
        if(typingData) {
            for (let user in typingData) {
                if (user !== currentUser && typingData[user] === true) { isSomeoneTyping = true; break; }
            }
        }
        document.getElementById('typing-indicator').style.display = isSomeoneTyping ? 'block' : 'none';
    });

    // --- Firebase Syncing ---
    onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        localMessages.push({ id: snapshot.key, ...data });
        renderAllMessages();
        if (data.sender !== currentUser) soundEffects.receive();
    });

    onChildRemoved(messagesRef, (snapshot) => {
        localMessages = localMessages.filter(msg => msg.id !== snapshot.key);
        renderAllMessages();
    });

    // --- Rendering Logic ---
    function renderAllMessages() {
        messagesContainer.innerHTML = ''; 
        
        localMessages.forEach(msg => {
            const isSelf = (msg.sender === currentUser);
            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            let displayText = escapeHTML(msg.text);
            let cssClass = 'plain-text';
            
            // Decryption Logic
            if (msg.isEncrypted !== false) { 
                if (isGlobalDecrypted) {
                    const secretKey = localStorage.getItem("cyber_pass");
                    try {
                        const bytes = CryptoJS.AES.decrypt(msg.text, secretKey);
                        const originalText = bytes.toString(CryptoJS.enc.Utf8);
                        
                        if (originalText) {
                            displayText = escapeHTML(originalText);
                            cssClass = 'plain-text';
                        } else {
                            // WRONG PASSWORD / KEY MISMATCH
                            displayText = "⚠️ [WRONG KEY - DECRYPTION FAILED]";
                            cssClass = 'error-text';
                        }
                    } catch(e) { 
                        displayText = "⚠️ [DATA CORRUPTED]"; 
                        cssClass = 'error-text';
                    }
                } else {
                    // Show Cipher Text
                    displayText = escapeHTML(msg.text);
                    cssClass = 'enc-text';
                }
            }

            const row = document.createElement('div');
            row.id = `msg-${msg.id}`; 
            row.className = `message-row ${isSelf ? 'sent' : 'received'}`;

            row.innerHTML = `
                ${!isSelf ? `<div class="msg-sender">${escapeHTML(msg.sender)}</div>` : ''}
                <div class="bubble">
                    <div class="${cssClass}">${displayText}</div>
                </div>
                <div class="msg-meta">
                    <span>${timeStr}</span>
                    ${msg.isEncrypted !== false ? (isGlobalDecrypted ? '<span style="color:#00ffa3;">🔓</span>' : '<span>🔒</span>') : ''}
                    <button class="delete-btn" onclick="deleteMsg('${msg.id}')" title="Delete from Server">✕</button>
                </div>
            `;
            messagesContainer.appendChild(row);
        });
        
        // Auto scroll to bottom
        messagesContainer.scrollTo(0, messagesContainer.scrollHeight);
    }

    // --- Helper Functions ---
    window.deleteMsg = function(msgId) { 
        if (confirm("මෙම Message එක Server එකෙන් සදහටම Delete කරන්නද?")) remove(ref(db, `messages/${msgId}`)); 
    };
    
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

    // Init App
    checkDeviceAuth();
</script>

</body>
</html>
